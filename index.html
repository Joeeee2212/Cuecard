<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0c0f" />
  <link rel="manifest" href="./manifest.json" />
  <title>CueCard Web · 中文智能提词器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 顶部控制栏 -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button id="btnCards" class="icon-btn" title="提词卡片库">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="7" y1="9" x2="17" y2="9"/>
            <line x1="7" y1="13" x2="13" y2="13"/>
          </svg>
          <span class="btn-label">卡片</span>
        </button>

        <div class="mode-switch" role="tablist" aria-label="跟随模式">
          <button class="mode-btn active" data-mode="voice" title="中文语音识别，字随声动">语音跟读</button>
          <button class="mode-btn" data-mode="vad" title="离线音量检测：说话就滚，停顿就停">声控滚动</button>
          <button class="mode-btn" data-mode="auto" title="经典匀速滚动">匀速滚动</button>
        </div>
      </div>

      <div class="topbar-center">
        <button id="btnToggleRun" class="primary-btn" title="开始/暂停 (Space)">
          <span class="rec-dot" id="recDot"></span>
          <span id="runLabel">开始跟读</span>
        </button>
        <button id="btnReset" class="icon-btn" title="回到开头 (R)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>

      <div class="topbar-right">
        <button id="btnEdit" class="icon-btn" title="编辑当前提词卡">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span class="btn-label">编辑</span>
        </button>
        <button id="btnPip" class="icon-btn" title="桌面悬浮小窗 (Chrome/Edge)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <rect x="12" y="9" width="8" height="6" rx="1" fill="currentColor" fill-opacity="0.25"/>
          </svg>
          <span class="btn-label">悬浮窗</span>
        </button>
        <button id="btnSettings" class="icon-btn" title="排版与识别设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 状态与实时语音回显条 -->
    <div class="status-strip" id="statusStrip">
      <div class="status-left">
        <span class="status-badge" id="statusBadge">待机</span>
        <span class="live-transcript" id="liveTranscript">点击「开始跟读」或按空格开始；点击任意文字可定位</span>
      </div>
      <div class="status-right">
        <div class="vu-meter" id="vuMeter" title="麦克风音量">
          <div class="vu-bar" id="vuBar"></div>
        </div>
        <span class="progress-text" id="progressText">0%</span>
      </div>
    </div>

    <!-- 主提词区域（支持移入 Document PiP 悬浮窗） -->
    <main class="stage-wrapper" id="stageWrapper">
      <div class="prompter-stage" id="prompterStage">
        <!-- 视线引导线（靠近顶部摄像头位置） -->
        <div class="focus-guide" aria-hidden="true">
          <span class="guide-arrow left">▶</span>
          <div class="guide-line"></div>
          <span class="guide-arrow right">◀</span>
        </div>

        <!-- 顶部与底部渐隐遮罩 -->
        <div class="fade-top" aria-hidden="true"></div>
        <div class="fade-bottom" aria-hidden="true"></div>

        <!-- 实际滚动文本容器 -->
        <div class="script-viewport" id="scriptViewport">
          <div class="script-content" id="scriptContent"></div>
        </div>

        <!-- 悬浮窗内迷你控制栏（仅在 PiP 模式下显示） -->
        <div class="pip-mini-bar" id="pipMiniBar">
          <button id="pipBtnToggle" class="mini-btn primary">开始</button>
          <button id="pipBtnReset" class="mini-btn">重来</button>
          <button id="pipBtnFontMinus" class="mini-btn">A-</button>
          <button id="pipBtnFontPlus" class="mini-btn">A+</button>
          <span class="pip-transcript" id="pipTranscript">就绪</span>
        </div>
      </div>
    </main>

    <!-- 左侧提词卡片抽屉 -->
    <aside class="drawer left-drawer" id="cardsDrawer" aria-hidden="true">
      <div class="drawer-header">
        <h2>提词卡片库</h2>
        <div class="drawer-actions">
          <button id="btnNewCard" class="small-primary-btn">+ 新建</button>
          <button class="close-drawer-btn" data-close="cardsDrawer">✕</button>
        </div>
      </div>
      <div class="card-list" id="cardList"></div>
      <div class="drawer-footer">
        <label class="file-import-btn">
          导入 .txt / .md
          <input type="file" id="fileImport" accept=".txt,.md,text/plain,text/markdown" hidden />
        </label>
        <button id="btnExportCard" class="ghost-btn">导出当前稿</button>
      </div>
    </aside>

    <!-- 右侧设置抽屉 -->
    <aside class="drawer right-drawer" id="settingsDrawer" aria-hidden="true">
      <div class="drawer-header">
        <h2>排版与识别设置</h2>
        <button class="close-drawer-btn" data-close="settingsDrawer">✕</button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <div class="setting-row">
            <label for="optFontSize">字体大小</label>
            <span id="valFontSize">38px</span>
          </div>
          <input type="range" id="optFontSize" min="20" max="72" step="2" value="38" />
        </div>

        <div class="setting-group">
          <div class="setting-row">
            <label for="optLineHeight">行距</label>
            <span id="valLineHeight">1.65</span>
          </div>
          <input type="range" id="optLineHeight" min="1.25" max="2.4" step="0.05" value="1.65" />
        </div>

        <div class="setting-group">
          <div class="setting-row">
            <label for="optWidth">提词宽度（越窄越不飘眼）</label>
            <span id="valWidth">680px</span>
          </div>
          <input type="range" id="optWidth" min="300" max="1100" step="20" value="680" />
        </div>

        <div class="setting-group">
          <div class="setting-row">
            <label for="optSpeed">滚动速度（声控 / 匀速模式）</label>
            <span id="valSpeed">48 px/s</span>
          </div>
          <input type="range" id="optSpeed" min="15" max="140" step="3" value="48" />
        </div>

        <div class="setting-group">
          <div class="setting-row">
            <label for="optVadThreshold">声控灵敏度（环境吵就调高）</label>
            <span id="valVadThreshold">14</span>
          </div>
          <input type="range" id="optVadThreshold" min="4" max="45" step="1" value="14" />
        </div>

        <div class="setting-group">
          <label for="optLang">语音识别语言</label>
          <select id="optLang" class="select-input">
            <option value="zh-CN" selected>中文（普通话 · zh-CN）</option>
            <option value="zh-HK">中文（粤语 · zh-HK）</option>
            <option value="zh-TW">中文（繁體 · zh-TW）</option>
            <option value="en-US">English (en-US)</option>
          </select>
        </div>

        <div class="setting-group toggle-row">
          <label for="optMirror">镜像翻转（配提词器玻璃）</label>
          <input type="checkbox" id="optMirror" />
        </div>

        <div class="setting-group toggle-row">
          <label for="optCenter">文字居中对齐</label>
          <input type="checkbox" id="optCenter" />
        </div>

        <div class="setting-tips">
          <p><strong>快捷键：</strong></p>
          <ul>
            <li><code>Space</code> 开始 / 暂停</li>
            <li><code>R</code> 回到开头</li>
            <li><code>↑ / ↓</code> 调整滚动速度</li>
            <li><code>M</code> 切换镜像</li>
            <li><code>点击任意字</code> 从该位置继续跟读</li>
          </ul>
          <p class="tip-note">💡 若 Chrome 语音跟读提示网络错误（国内访问 Google 语音受限），请切换为 <strong>Safari / Edge</strong>，或直接使用完全离线的 <strong>「声控滚动」</strong> 模式。</p>
        </div>
      </div>
    </aside>

    <!-- 编辑文稿弹窗 -->
    <div class="modal-backdrop" id="editorModal" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <input type="text" id="editTitle" class="title-input" placeholder="输入提词卡标题..." />
          <button class="close-drawer-btn" id="btnCloseEditor">✕</button>
        </div>
        <textarea id="editBody" class="script-textarea" placeholder="在此粘贴或编写你的提词文稿..."></textarea>
        <div class="modal-footer">
          <span class="word-stats" id="wordStats">0 字 · 预计 0 秒</span>
          <div class="modal-footer-btns">
            <button id="btnCancelEdit" class="ghost-btn">取消</button>
            <button id="btnSaveEdit" class="small-primary-btn">保存并应用</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 遮罩 -->
    <div class="scrim" id="scrim"></div>

    <!-- 轻提示 Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
